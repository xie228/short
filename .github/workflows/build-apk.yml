name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -q embyshort.zip -d src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: src/embyshort
        run: pnpm install

      - name: Generate native project
        working-directory: src/embyshort
        run: npx expo prebuild --platform android

      - name: Sign release build with debug key
        working-directory: src/embyshort/android
        run: |
          python3 - <<'PY'
          import re
          p = "app/build.gradle"
          s = open(p).read()
          if "signingConfig signingConfigs.debug" not in s.split("buildTypes")[-1]:
              s = s.replace("""release {
            // Caution! In production, you need to generate your own keystore file.
            signingConfig signingConfigs.debug""", """release {
            // Caution! In production, you need to generate your own keystore file.
            signingConfig signingConfigs.debug""")
              open(p, "w").write(s)
          print("done")
          PY
          grep -A3 "release {" app/build.gradle | head -8

      - name: Build release APK (bundles JS)
        working-directory: src/embyshort/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: embyshort-apk
          path: src/embyshort/android/app/build/outputs/apk/release/app-release.apk
