name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -q embyshort.zip -d src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: src/embyshort
        run: pnpm install

      - name: Generate native project
        working-directory: src/embyshort
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: src/embyshort/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: embyshort-apk
          path: src/embyshort/android/app/build/outputs/apk/debug/app-debug.apk
